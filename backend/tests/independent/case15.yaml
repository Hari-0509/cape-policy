apiVersion: v1
kind: Namespace
metadata:
  name: app-blue
  labels:
    cape-policy/class: application
---
apiVersion: v1
kind: Namespace
metadata:
  name: app-green
  labels:
    cape-policy/class: application
---
apiVersion: v1
kind: Namespace
metadata:
  name: app-red
  labels:
    cape-policy/class: application
---
apiVersion: v1
kind: Namespace
metadata:
  name: ops-system
  labels:
    cape-policy/class: system
---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sAllowedRepos
metadata:
  name: all-app-repos
  labels:
    owner-team: security
spec:
  match:
    namespaces: ["app-blue", "app-green", "app-red"]
  parameters:
    repos:
    - registry.example.com/
