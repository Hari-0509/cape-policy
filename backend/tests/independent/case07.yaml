apiVersion: v1
kind: Namespace
metadata:
  name: frontend
  labels:
    cape-policy/class: application
---
apiVersion: v1
kind: Namespace
metadata:
  name: backend
  labels:
    cape-policy/class: application
---
apiVersion: v1
kind: Namespace
metadata:
  name: jobs
  labels:
    cape-policy/class: application
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    cape-policy/class: system
---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sAllowedRepos
metadata:
  name: image-source-policy
  labels:
    owner-team: platform
spec:
  match:
    namespaces: ["frontend", "jobs"]
  parameters:
    repos:
    - docker.io/library/
