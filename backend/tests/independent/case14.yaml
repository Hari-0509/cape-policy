apiVersion: v1
kind: Namespace
metadata:
  name: resource-split
  labels:
    cape-policy/class: application
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: resource-sa
  namespace: resource-split
  labels:
    owner-team: beta
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: resource-split
  labels:
    owner-team: beta
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-wildcard
  namespace: resource-split
  labels:
    owner-team: gamma
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-reader-bind
  namespace: resource-split
  labels:
    owner-team: beta
subjects:
- kind: ServiceAccount
  name: resource-sa
  namespace: resource-split
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-wildcard-bind
  namespace: resource-split
  labels:
    owner-team: gamma
subjects:
- kind: ServiceAccount
  name: resource-sa
  namespace: resource-split
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secret-wildcard
