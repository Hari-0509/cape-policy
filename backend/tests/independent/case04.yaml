apiVersion: v1
kind: Namespace
metadata:
  name: app-d
  labels:
    cape-policy/class: application
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: batch-sa
  namespace: app-d
  labels:
    owner-team: eta
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: batch-pod-read
  namespace: app-d
  labels:
    owner-team: eta
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: batch-pod-all
  namespace: app-d
  labels:
    owner-team: theta
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: batch-read-bind
  namespace: app-d
  labels:
    owner-team: eta
subjects:
- kind: ServiceAccount
  name: batch-sa
  namespace: app-d
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: batch-pod-read
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: batch-all-bind
  namespace: app-d
  labels:
    owner-team: theta
subjects:
- kind: ServiceAccount
  name: batch-sa
  namespace: app-d
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: batch-pod-all
