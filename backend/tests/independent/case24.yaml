apiVersion: v1
kind: Namespace
metadata:
  name: app-final
  labels:
    cape-policy/class: application
---
apiVersion: v1
kind: Namespace
metadata:
  name: system-final
  labels:
    cape-policy/class: system
---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sAllowedRepos
metadata:
  name: no-namespace-filter
  labels:
    owner-team: platform
spec:
  match:
    kinds:
    - apiGroups: [""]
      kinds: ["Pod"]
  parameters:
    repos:
    - docker.io/
