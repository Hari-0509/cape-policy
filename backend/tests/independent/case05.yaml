apiVersion: v1
kind: Namespace
metadata:
  name: app-one
  labels:
    cape-policy/class: application
---
apiVersion: v1
kind: Namespace
metadata:
  name: app-two
  labels:
    cape-policy/class: application
---
apiVersion: v1
kind: Namespace
metadata:
  name: app-three
  labels:
    cape-policy/class: application
---
apiVersion: v1
kind: Namespace
metadata:
  name: platform
  labels:
    cape-policy/class: system
---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sAllowedRepos
metadata:
  name: allowed-repos
  labels:
    owner-team: security
spec:
  match:
    namespaces: ["app-one", "app-two"]
  parameters:
    repos:
    - registry.example.com/
