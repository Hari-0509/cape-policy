apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-reader-binding
  namespace: team-backend
  labels:
    owner-team: security-team
    cape-policy/managed: "true"
subjects:
- kind: ServiceAccount
  name: backend-app-sa
  namespace: team-backend
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
