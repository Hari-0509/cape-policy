apiVersion: v1
kind: Namespace
metadata:
  name: app-b
  labels:
    cape-policy/class: application
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
  namespace: app-b
  labels:
    owner-team: gamma
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-view
  namespace: app-b
  labels:
    owner-team: gamma
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-any
  namespace: app-b
  labels:
    owner-team: delta
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: view-worker
  namespace: app-b
  labels:
    owner-team: gamma
subjects:
- kind: ServiceAccount
  name: worker
  namespace: app-b
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-view
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: any-worker
  namespace: app-b
  labels:
    owner-team: delta
subjects:
- kind: ServiceAccount
  name: worker
  namespace: app-b
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-any
