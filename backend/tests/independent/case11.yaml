apiVersion: v1
kind: Namespace
metadata:
  name: automation
  labels:
    cape-policy/class: application
---
apiVersion: v1
kind: Namespace
metadata:
  name: database
  labels:
    cape-policy/class: application
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: migration-job
  namespace: automation
  labels:
    owner-team: epsilon
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: db-config-reader
  namespace: database
  labels:
    owner-team: epsilon
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: migration-config-bind
  namespace: database
  labels:
    owner-team: epsilon
subjects:
- kind: ServiceAccount
  name: migration-job
  namespace: automation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: db-config-reader
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: database-ingress-deny
  namespace: database
  labels:
    owner-team: zeta
spec:
  podSelector: {}
  policyTypes: [Ingress]
