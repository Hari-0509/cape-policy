apiVersion: v1
kind: Namespace
metadata:
  name: build
  labels:
    cape-policy/class: application
---
apiVersion: v1
kind: Namespace
metadata:
  name: secrets
  labels:
    cape-policy/class: application
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: builder
  namespace: build
  labels:
    owner-team: gamma
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-reader
  namespace: secrets
  labels:
    owner-team: gamma
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: builder-secret-bind
  namespace: secrets
  labels:
    owner-team: gamma
subjects:
- kind: ServiceAccount
  name: builder
  namespace: build
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secret-reader
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: secrets-deny-ingress
  namespace: secrets
  labels:
    owner-team: delta
spec:
  podSelector: {}
  policyTypes: [Ingress]
