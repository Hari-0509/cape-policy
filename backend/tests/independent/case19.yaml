apiVersion: v1
kind: Namespace
metadata:
  name: api-app
  labels:
    cape-policy/class: application
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api
  namespace: api-app
  labels:
    owner-team: backend
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          cape-policy/class: application
