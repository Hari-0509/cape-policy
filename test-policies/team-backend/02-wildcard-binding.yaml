apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-full-access-binding
  namespace: team-backend
  labels:
    owner-team: backend-team
    cape-policy/managed: "true"
subjects:
- kind: ServiceAccount
  name: backend-app-sa
  namespace: team-backend
roleRef:
  kind: Role
  name: backend-full-access
  apiGroup: rbac.authorization.k8s.io
