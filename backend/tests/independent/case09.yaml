apiVersion: v1
kind: Namespace
metadata:
  name: identity
  labels:
    cape-policy/class: application
---
apiVersion: v1
kind: Namespace
metadata:
  name: protected
  labels:
    cape-policy/class: application
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-worker
  namespace: identity
  labels:
    owner-team: alpha
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: protected-reader
  namespace: protected
  labels:
    owner-team: alpha
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: external-worker-bind
  namespace: protected
  labels:
    owner-team: alpha
subjects:
- kind: ServiceAccount
  name: external-worker
  namespace: identity
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: protected-reader
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-ingress
  namespace: protected
  labels:
    owner-team: beta
spec:
  podSelector: {}
  policyTypes: [Ingress]
