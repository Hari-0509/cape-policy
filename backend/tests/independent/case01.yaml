apiVersion: v1
kind: Namespace
metadata:
  name: app-a
  labels:
    cape-policy/class: application
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-sa
  namespace: app-a
  labels:
    owner-team: alpha
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: app-a
  labels:
    owner-team: alpha
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-admin
  namespace: app-a
  labels:
    owner-team: beta
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: reader-binding
  namespace: app-a
  labels:
    owner-team: alpha
subjects:
- kind: ServiceAccount
  name: api-sa
  namespace: app-a
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: admin-binding
  namespace: app-a
  labels:
    owner-team: beta
subjects:
- kind: ServiceAccount
  name: api-sa
  namespace: app-a
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-admin
