apiVersion: v1
kind: Namespace
metadata:
  name: app-c
  labels:
    cape-policy/class: application
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: report-sa
  namespace: app-c
  labels:
    owner-team: epsilon
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: report-reader
  namespace: app-c
  labels:
    owner-team: epsilon
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: report-wildcard
  namespace: app-c
  labels:
    owner-team: zeta
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: report-read-bind
  namespace: app-c
  labels:
    owner-team: epsilon
subjects:
- kind: ServiceAccount
  name: report-sa
  namespace: app-c
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: report-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: report-wild-bind
  namespace: app-c
  labels:
    owner-team: zeta
subjects:
- kind: ServiceAccount
  name: report-sa
  namespace: app-c
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: report-wildcard
