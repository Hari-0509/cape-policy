apiVersion: v1
kind: Namespace
metadata:
  name: all-namespaces-app
  labels:
    cape-policy/class: application
---
apiVersion: v1
kind: Namespace
metadata:
  name: all-namespaces-system
  labels:
    cape-policy/class: system
---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sAllowedRepos
metadata:
  name: global-repo-policy
  labels:
    owner-team: compliance
spec:
  match:
    kinds:
    - apiGroups: [""]
      kinds: ["Pod"]
  parameters:
    repos:
    - registry.corp.example/
