name: CAPE-Policy Scan

on:
  schedule:
    - cron: '0 */6 * * *'
  pull_request:
    paths:
      - 'test-policies/**'
      - 'backend/src/**'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: cape-policy-ci

      - name: Install OPA Gatekeeper
        run: |
          kubectl apply -f https://raw.githubusercontent.com/open-policy-agent/gatekeeper/master/deploy/gatekeeper.yaml
          kubectl wait --for=condition=Ready pods --all -n gatekeeper-system --timeout=120s

      - name: Install Kyverno
        run: |
          helm repo add kyverno https://kyverno.github.io/kyverno/
          helm repo update
          helm install kyverno kyverno/kyverno -n kyverno --create-namespace --wait --timeout 120s

      - name: Create namespaces
        run: |
          kubectl create namespace team-security
          kubectl create namespace team-backend
          kubectl create namespace team-data
          kubectl label namespace team-security owner=security-team
          kubectl label namespace team-backend owner=backend-team
          kubectl label namespace team-data owner=data-team

      - name: Apply base RBAC and NetworkPolicy test resources
        run: |
          kubectl apply -f test-policies/team-backend/00-serviceaccount.yaml
          kubectl apply -f test-policies/team-backend/01-wildcard-role.yaml
          kubectl apply -f test-policies/team-backend/02-wildcard-binding.yaml
          kubectl apply -f test-policies/team-backend/03-cross-namespace-role.yaml
          kubectl apply -f test-policies/team-backend/04-cross-namespace-binding.yaml
          kubectl apply -f test-policies/team-data/01-default-deny-netpol.yaml
          kubectl apply -f test-policies/team-security/01-narrow-role.yaml
          kubectl apply -f test-policies/team-security/02-narrow-binding.yaml

      - name: Apply Gatekeeper ConstraintTemplate and wait for CRD registration
        run: |
          kubectl apply -f test-policies/team-security/03-image-constrainttemplate.yaml
          kubectl wait --for=condition=Established crd/k8sallowedrepos.constraints.gatekeeper.sh --timeout=120s
          sleep 3

      - name: Apply Gatekeeper Constraint
        run: |
          kubectl apply -f test-policies/team-security/04-image-constraint.yaml

      - name: Apply Kyverno policy
        run: |
          kubectl apply -f test-policies/team-security/05-readonly-fs-policy.yaml

      - name: Run CAPE-Policy scan
        working-directory: backend
        run: |
          mkdir -p data
          python src/ingestion/collector.py > data/latest_scan.json
          python src/detection/engine.py

      - name: Upload scan report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cape-policy-conflict-report
          path: backend/data/conflict_report.json

      - name: Fail the build if high-severity conflicts found
        working-directory: backend
        run: |
          python3 -c "
          import json, sys
          with open('data/conflict_report.json') as f:
              conflicts = json.load(f)
          high_severity = [c for c in conflicts if c.get('severity') == 'high']
          print(f'Found {len(conflicts)} total conflicts, {len(high_severity)} high severity')
          if high_severity:
              print('HIGH SEVERITY CONFLICTS DETECTED:')
              for c in high_severity:
                  print(f\"  - [{c[\'conflict_type\']}] at fault: {c.get(\'at_fault_team\')}\")
              sys.exit(1)
          "
