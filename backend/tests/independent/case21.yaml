apiVersion: v1
kind: Namespace
metadata:
  name: unified-app
  labels:
    cape-policy/class: application
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: unified-deny
  namespace: unified-app
  labels:
    owner-team: unified
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: unified-pod-reader
  namespace: unified-app
  labels:
    owner-team: unified
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: unified-sa
  namespace: unified-app
  labels:
    owner-team: unified
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: unified-reader-bind
  namespace: unified-app
  labels:
    owner-team: unified
subjects:
- kind: ServiceAccount
  name: unified-sa
  namespace: unified-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: unified-pod-reader
