apiVersion: v1
kind: Namespace
metadata:
  name: web-app
  labels:
    cape-policy/class: application
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend
  namespace: web-app
  labels:
    owner-team: frontend
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: frontend
