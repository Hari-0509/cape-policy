apiVersion: v1
kind: Namespace
metadata:
  name: shared-app
  labels:
    cape-policy/class: application
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shared-sa
  namespace: shared-app
  labels:
    owner-team: alpha
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shared-pod-reader
  namespace: shared-app
  labels:
    owner-team: alpha
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shared-pod-editor
  namespace: shared-app
  labels:
    owner-team: alpha
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shared-read-bind
  namespace: shared-app
  labels:
    owner-team: alpha
subjects:
- kind: ServiceAccount
  name: shared-sa
  namespace: shared-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: shared-pod-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shared-edit-bind
  namespace: shared-app
  labels:
    owner-team: alpha
subjects:
- kind: ServiceAccount
  name: shared-sa
  namespace: shared-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: shared-pod-editor
